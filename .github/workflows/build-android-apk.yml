name: Build BannaSanj Android APK

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (بناسنج)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Install Dependencies, Build Web & Generate Fresh Android Project
        run: |
          npm install --legacy-peer-deps
          if ! grep -q "@capacitor/android" package.json; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
            npm install -D --legacy-peer-deps @capacitor/cli
          fi
          rm -f capacitor.config.ts
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ir.bannasanj.app",
            "appName": "بناسنج",
            "webDir": "dist",
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#F8FAFC"
            }
          }
          EOF
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android
          if [ -f "scripts/generate-android-icons.cjs" ]; then
            node scripts/generate-android-icons.cjs
          fi

      - name: Compile Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BannaSanj-v1.0.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BannaSanj-Android-APK
          path: android/app/build/outputs/apk/debug/BannaSanj-v1.0.apk
          if-no-files-found: error
