name: Build BannaSanj Android APK

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (بناسنج)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies and sync Android assets
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BannaSanj-v1.0.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BannaSanj-Android-APK
          path: android/app/build/outputs/apk/debug/BannaSanj-v1.0.apk
          if-no-files-found: error
