name: Build BannaSanj Android APK

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (بناسنج)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies and sync Android assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BannaSanj-v1.0.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BannaSanj-Android-APK
          path: android/app/build/outputs/apk/debug/BannaSanj-v1.0.apk
          if-no-files-found: error
